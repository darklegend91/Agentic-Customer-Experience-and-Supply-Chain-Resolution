<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic customer-resolution architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#eaf0f5; --muted:#91a0ae; --panel:#111c27; --teal:#62dec2; --amber:#f3bd69; --red:#ff8b86; --blue:#77b9ff; --font-sans:'Geist',system-ui,sans-serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px; min-height:100vh; background:#0a1118; color:var(--ink); font-family:var(--font-sans); }
    .frame { width:100%; max-width:1280px; margin:0 auto; }
    .eyebrow { margin:0 0 7px; color:var(--teal); font:500 11px/1.2 var(--font-mono); letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0 0 18px; font-size:27px; line-height:1.15; font-weight:600; letter-spacing:-.025em; }
    .diagram-container { width:100%; overflow-x:auto; border:1px solid #263443; border-radius:14px; box-shadow:0 18px 55px rgba(0,0,0,.28); }
    svg { width:100%; min-width:1280px; display:block; }
    @media print { body { padding:0; } .diagram-container { overflow:visible; border:0; } svg { min-width:0; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Secure paved road · architecture overview</p>
    <h1>Agentic Customer Experience &amp; Supply-Chain Resolution</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-title system-architecture-desc">
        <title id="system-architecture-title">Agentic customer-resolution system architecture</title>
        <desc id="system-architecture-desc">A secure architecture showing a Streamlit control room and FastAPI boundary leading to a LangGraph agent workflow, read-only evidence sources, audit storage, human approval, and an explicitly blocked loyalty-provider write path.</desc>
        <defs>
          <linearGradient id="system-architecture-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#143340"/><stop offset=".55" stop-color="#0c141d"/><stop offset="1" stop-color="#0a1118"/>
          </linearGradient>
          <marker id="system-architecture-arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#62dec2"/></marker>
          <marker id="system-architecture-arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f3bd69"/></marker>
          <marker id="system-architecture-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#77b9ff"/></marker>
          <style>
            .zone-label { fill:#91a0ae; font:500 10px 'Geist Mono',monospace; letter-spacing:.14em; }
            .node-title { fill:#eaf0f5; font:600 15px 'Geist',sans-serif; }
            .node-detail { fill:#91a0ae; font:400 10px 'Geist Mono',monospace; }
            .chip { font:600 8px 'Geist Mono',monospace; letter-spacing:.08em; }
            .flow-label { font:500 9px 'Geist Mono',monospace; letter-spacing:.05em; }
            .note { fill:#91a0ae; font:400 11px 'Geist',sans-serif; }
          </style>
        </defs>

        <rect width="1280" height="720" fill="url(#system-architecture-bg)"/>
        <path d="M0 102 H1280 M0 642 H1280" stroke="#263443" stroke-width="1"/>

        <!-- zones: fill only so connectors are not mistaken for crossing a node -->
        <rect x="30" y="125" width="420" height="465" rx="16" fill="#111c27" fill-opacity=".58"/>
        <rect x="465" y="125" width="510" height="465" rx="16" fill="#162330" fill-opacity=".57"/>
        <rect x="995" y="125" width="255" height="465" rx="16" fill="#111c27" fill-opacity=".58"/>
        <text x="55" y="153" class="zone-label">OPERATOR CONSOLE</text>
        <text x="490" y="153" class="zone-label">TRUSTED APPLICATION RUNTIME</text>
        <text x="1020" y="153" class="zone-label">CONTROLLED EVIDENCE / BOUNDARY</text>

        <!-- connectors behind nodes -->
        <path d="M210 324 H260" fill="none" stroke="#62dec2" stroke-width="2" marker-end="url(#system-architecture-arrow-teal)"/>
        <path d="M430 324 H490" fill="none" stroke="#62dec2" stroke-width="2" marker-end="url(#system-architecture-arrow-teal)"/>
        <path d="M680 324 H750" fill="none" stroke="#62dec2" stroke-width="2.2" marker-end="url(#system-architecture-arrow-teal)"/>
        <path d="M950 280 H990 V205 H1030" fill="none" stroke="#f3bd69" stroke-width="1.8" marker-end="url(#system-architecture-arrow-amber)"/>
        <path d="M950 367 H990 V417 H1030" fill="none" stroke="#77b9ff" stroke-width="1.8" marker-end="url(#system-architecture-arrow-blue)"/>
        <path d="M850 403 V470 H665 V510" fill="none" stroke="#f3bd69" stroke-width="1.8" marker-end="url(#system-architecture-arrow-amber)"/>
        <path d="M590 510 V478 H585 V403" fill="none" stroke="#77b9ff" stroke-width="1.8" marker-end="url(#system-architecture-arrow-blue)"/>
        <path d="M850 245 V205 H585 V245" fill="none" stroke="#91a0ae" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#system-architecture-arrow-blue)"/>
        <path d="M490 360 H430" fill="none" stroke="#91a0ae" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#system-architecture-arrow-blue)"/>
        <path d="M260 360 H210" fill="none" stroke="#91a0ae" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#system-architecture-arrow-blue)"/>
        <path d="M950 350 H990 V602 H1012" fill="none" stroke="#ff8b86" stroke-width="1.7" stroke-dasharray="6 5"/>
        <path d="M1012 592 L1022 612 M1022 592 L1012 612" stroke="#ff8b86" stroke-width="2"/>

        <!-- connector labels live in clear space -->
        <text x="218" y="309" fill="#62dec2" class="flow-label">REQUEST</text>
        <text x="444" y="309" fill="#62dec2" class="flow-label">API CALL</text>
        <text x="691" y="309" fill="#62dec2" class="flow-label">TYPED JOB</text>
        <text x="977" y="190" fill="#f3bd69" class="flow-label" text-anchor="end">READ ONLY</text>
        <text x="977" y="405" fill="#77b9ff" class="flow-label" text-anchor="end">CHECKPOINT + AUDIT</text>
        <text x="680" y="462" fill="#f3bd69" class="flow-label">APPROVAL PROPOSAL</text>
        <text x="564" y="458" fill="#77b9ff" class="flow-label" text-anchor="end">REVIEWER DECISION</text>
        <text x="716" y="194" fill="#91a0ae" class="flow-label" text-anchor="middle">SAFE RESPONSE</text>
        <text x="1040" y="580" fill="#ff8b86" class="flow-label">NO LIVE WRITE ROUTE</text>

        <!-- Support agent -->
        <rect x="55" y="276" width="155" height="96" rx="11" fill="#111c27" stroke="#91a0ae" stroke-width="1.2"/>
        <rect x="68" y="289" width="35" height="15" rx="4" fill="#263443"/>
        <text x="86" y="300" fill="#91a0ae" class="chip" text-anchor="middle">HUMAN</text>
        <text x="132" y="327" class="node-title" text-anchor="middle">Support agent</text>
        <text x="132" y="347" class="node-detail" text-anchor="middle">customer issue / order ID</text>

        <!-- Streamlit -->
        <rect x="260" y="270" width="170" height="108" rx="11" fill="#132937" stroke="#62dec2" stroke-width="1.4"/>
        <rect x="274" y="284" width="29" height="15" rx="4" fill="#1f4b50"/>
        <text x="289" y="295" fill="#62dec2" class="chip" text-anchor="middle">UI</text>
        <text x="345" y="323" class="node-title" text-anchor="middle">Streamlit console</text>
        <text x="345" y="343" class="node-detail" text-anchor="middle">investigate · workflow</text>
        <text x="345" y="359" class="node-detail" text-anchor="middle">data explorer</text>

        <!-- FastAPI security boundary -->
        <rect x="490" y="245" width="190" height="158" rx="11" fill="#132937" stroke="#62dec2" stroke-width="1.5"/>
        <rect x="504" y="259" width="50" height="15" rx="4" fill="#1f4b50"/>
        <text x="529" y="270" fill="#62dec2" class="chip" text-anchor="middle">API GATE</text>
        <text x="585" y="302" class="node-title" text-anchor="middle">FastAPI boundary</text>
        <text x="585" y="325" class="node-detail" text-anchor="middle">auth · request ID</text>
        <text x="585" y="342" class="node-detail" text-anchor="middle">sanitization · PII masking</text>
        <text x="585" y="359" class="node-detail" text-anchor="middle">input / output guards</text>
        <text x="585" y="379" fill="#62dec2" class="node-detail" text-anchor="middle">only allowed entry point</text>

        <!-- Agent workflow -->
        <rect x="750" y="245" width="200" height="158" rx="11" fill="#18312f" stroke="#62dec2" stroke-width="1.8"/>
        <rect x="764" y="259" width="39" height="15" rx="4" fill="#255449"/>
        <text x="784" y="270" fill="#62dec2" class="chip" text-anchor="middle">CORE</text>
        <text x="850" y="302" class="node-title" text-anchor="middle">LangGraph workflow</text>
        <text x="850" y="325" class="node-detail" text-anchor="middle">Laya triage + supervisor</text>
        <text x="850" y="342" class="node-detail" text-anchor="middle">allowlisted specialists</text>
        <text x="850" y="359" class="node-detail" text-anchor="middle">evidence ledger + rules</text>
        <text x="850" y="379" fill="#62dec2" class="node-detail" text-anchor="middle">grounded draft + response validation</text>

        <!-- Evidence -->
        <rect x="1030" y="160" width="190" height="115" rx="11" fill="#2c2921" stroke="#f3bd69" stroke-width="1.3"/>
        <rect x="1044" y="174" width="33" height="15" rx="4" fill="#4d4228"/>
        <text x="1061" y="185" fill="#f3bd69" class="chip" text-anchor="middle">READ</text>
        <text x="1125" y="214" class="node-title" text-anchor="middle">Verified evidence</text>
        <text x="1125" y="235" class="node-detail" text-anchor="middle">Neon: orders · delivery · loyalty</text>
        <text x="1125" y="251" class="node-detail" text-anchor="middle">Milvus semantic + keyword RAG</text>

        <!-- Audit -->
        <rect x="1030" y="365" width="190" height="105" rx="11" fill="#142637" stroke="#77b9ff" stroke-width="1.3"/>
        <rect x="1044" y="379" width="39" height="15" rx="4" fill="#21445e"/>
        <text x="1064" y="390" fill="#77b9ff" class="chip" text-anchor="middle">STATE</text>
        <text x="1125" y="419" class="node-title" text-anchor="middle">Workflow &amp; audit store</text>
        <text x="1125" y="440" class="node-detail" text-anchor="middle">Postgres runs · events · approvals</text>
        <text x="1125" y="456" class="node-detail" text-anchor="middle">fingerprinted evidence</text>

        <!-- Reviewer -->
        <rect x="520" y="510" width="200" height="90" rx="11" fill="#2c2921" stroke="#f3bd69" stroke-width="1.3"/>
        <rect x="534" y="524" width="48" height="15" rx="4" fill="#4d4228"/>
        <text x="558" y="535" fill="#f3bd69" class="chip" text-anchor="middle">REVIEW</text>
        <text x="620" y="560" class="node-title" text-anchor="middle">Human approval gate</text>
        <text x="620" y="579" class="node-detail" text-anchor="middle">re-fetch evidence · approve simulation</text>

        <!-- Provider boundary -->
        <rect x="1030" y="555" width="190" height="70" rx="11" fill="#2b1e23" stroke="#ff8b86" stroke-width="1.3" stroke-dasharray="6 4"/>
        <rect x="1044" y="568" width="45" height="15" rx="4" fill="#4a2830"/>
        <text x="1067" y="579" fill="#ff8b86" class="chip" text-anchor="middle">BLOCKED</text>
        <text x="1125" y="604" class="node-title" text-anchor="middle">Loyalty provider</text>
        <text x="1125" y="619" class="node-detail" text-anchor="middle">adapter exists; not invoked</text>

        <!-- legend / system invariant -->
        <text x="55" y="675" fill="#62dec2" class="flow-label">INVARIANT</text>
        <text x="134" y="675" class="note">Tools only receive sanitized, authorized input; evidence is read-only; sensitive changes require a reviewer and remain simulation-only.</text>
        <line x1="1090" y1="672" x2="1118" y2="672" stroke="#62dec2" stroke-width="2"/>
        <text x="1128" y="676" class="note">permitted</text>
        <line x1="1195" y1="672" x2="1223" y2="672" stroke="#ff8b86" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="1230" y="676" class="note">blocked</text>
      </svg>
    </div>
  </main>
</body>
</html>
