name: Agent security checks

on:
  pull_request:
  push:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/check_dependency_sources.py
      - name: Install hash-verified audit tools
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements-security.lock
      - name: Audit runtime and audit-tool locks without installing the application
        run: .audit-venv/bin/python scripts/audit_dependency_locks.py

  agent-regressions:
    needs: dependency-audit
    # Matches the developer's Mac and avoids installing CUDA dependencies.
    runs-on: macos-14
    timeout-minutes: 25
    env:
      APP_ENV: local
      LLM_ENABLED: "false"
      LANGFUSE_TRACING_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DATABASE_URL: ""
      WORKFLOW_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install hash-verified runtime into a fresh environment
        run: |
          python -m venv .test-venv
          .test-venv/bin/python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements.lock
          .test-venv/bin/python -m pip check
      - name: Run offline security and agent regression tests
        run: .test-venv/bin/python -m unittest tests.security.test_sanitization tests.security.test_dependency_sources tests.unit.test_groq_response tests.unit.test_compact_order_workflow tests.unit.test_model_safety_gate tests.unit.test_workflow_optimizations -v
